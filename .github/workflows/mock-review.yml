name: Experimental import packet checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mock-review:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Verify frozen packet bytes before execution
        run: |
          python3 - <<'PYCODE'
          import hashlib, json
          from pathlib import Path
          packet = json.loads(Path('packet-files.json').read_text())
          assert packet['packet_version'] == '0.1.7'
          for name, expected in packet['files'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          print('PASS: all 13 frozen packet files match recorded SHA-256')
          PYCODE
      - run: npm test
      - run: npm run review
      - run: npm run test:preview
      - name: Scope
        run: echo 'Mock-only GitHub checks. NOT Replit host execution, Agent discovery, official submission, approval or listing. No credentials or live email sends.'
